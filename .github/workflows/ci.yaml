name: ci-build-asp.net-project
on:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3
            - name: setup .net
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
            - name: restore dependencies
              run: dotnet restore
            - name: build app
              run: dotnet build --configuration Release --no-restore --no-restore